<!DOCTYPE html>
<html lang="en" ng-app="carRentalApp">
<head>
    <meta charset="UTF-8">
    <title>Car Rental Service</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" ng-controller="NavController">
        <a class="navbar-brand" href="#!/">Car Rental</a>
        <div class="navbar-nav mr-auto">
            <a class="nav-item nav-link" href="#!/">Home</a>
            <a class="nav-item nav-link" href="#!/cars">Cars</a>
            <a class="nav-item nav-link" href="#!/admin" ng-if="user.role === 'admin'">Admin</a>
        </div>
        <div class="navbar-nav" ng-if="!user">
            <a class="nav-item nav-link" href="#!/login">Login</a>
            <a class="nav-item nav-link" href="#!/register">Register</a>
        </div>
        <div class="navbar-nav" ng-if="user">
            <div class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="profileDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <span class="profile-circle">{{getProfileLetter()}}</span>
                </a>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="profileDropdown">
                    <a class="dropdown-item" href="#!/profile">Profile</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" href="#" ng-click="logout()">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div ng-view></div>
    </div>

    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="node_modules/angular/angular.min.js"></script>
    <script src="node_modules/angular-route/angular-route.min.js"></script>
    <script src="app.js"></script>
    <script src="controllers/homeController.js"></script>
    <script src="controllers/carController.js"></script>
</body>
</html>

<div class="container">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title">Profile</h2>
            <div class="row">
                <div class="col-md-12">
                    <p><strong>Email:</strong> {{user.email}}</p>
                    <p><strong>Role:</strong> {{user.role}}</p>
                    <p><strong>Last Login:</strong> {{user.lastLogin | date:'medium'}}</p>
                </div>
            </div>
        </div>
    </div>
</div>

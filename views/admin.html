<div class="container">
    <h2>Admin Dashboard</h2>
    
    <div class="card mb-4">
        <div class="card-body">
            <h3>Add New Car</h3>
            <form ng-submit="addCar()">
                <div class="form-group">
                    <label>Car Name</label>
                    <input type="text" class="form-control" ng-model="newCar.name" required>
                </div>
                <div class="form-group">
                    <label>Price per Day</label>
                    <input type="number" class="form-control" ng-model="newCar.price" required>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" class="form-control" ng-model="newCar.image" required>
                </div>
                <button type="submit" class="btn btn-primary">Add Car</button>
            </form>
        </div>
    </div>
    
    <h3>Manage Cars</h3>
    <div class="row">
        <div class="col-md-4" ng-repeat="car in cars">
            <div class="card car-card">
                <img ng-src="{{car.image}}" class="card-img-top car-image" alt="{{car.name}}">
                <div class="card-body">
                    <h5 class="card-title">{{car.name}}</h5>
                    <p class="card-text price">${{car.price}} per day</p>
                    <button class="btn btn-danger" ng-click="deleteCar(car._id)">Delete Car</button>
                </div>
            </div>
        </div>
    </div>
</div>
